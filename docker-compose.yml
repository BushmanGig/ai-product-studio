# Local PostgreSQL for AI Product Studio development.
# Start with:  docker compose up -d
# Matches the default DATABASE_URL in .env / .env.example.
services:
  db:
    image: postgres:16-alpine
    container_name: ai-product-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_product_studio
    ports:
      - "5432:5432"
    volumes:
      - ai_product_studio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ai_product_studio_db:
